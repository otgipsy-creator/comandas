<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Sin viewport-fit=cover a propósito: así iOS deja la app dentro del área segura
     (debajo de la barra de estado y arriba del indicador de inicio). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comandas</title>

<!-- ÍCONO Y MODO APP: estas etiquetas SÍ las lee iOS porque esta es la página
     de más arriba (la que se guarda al "Agregar a pantalla de inicio"). -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comandas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f3d28">

<style>
  html, body { margin:0; padding:0; height:100%; background:#0f3d28; }
  iframe { position:fixed; top:0; left:0; width:100%; height:100%; border:0; background:#f6f3ee; }
  #aviso { display:none; font-family:-apple-system, sans-serif; color:#fff; padding:28px; line-height:1.5; }
</style>
</head>
<body>

<div id="aviso"></div>
<iframe id="app" title="Comandas" allow="fullscreen"></iframe>

<script>
// ─────────────────────────────────────────────────────────────
//  PEGAR ACÁ la URL de tu web app de Apps Script (la que termina en /exec)
// ─────────────────────────────────────────────────────────────
var URL_APP = "PEGAR_ACA_LA_URL_QUE_TERMINA_EN_/exec";

(function () {
  var frame = document.getElementById("app");
  var aviso = document.getElementById("aviso");
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APP)) {
    frame.style.display = "none";
    aviso.style.display = "block";
    aviso.innerHTML = "<b>Falta configurar la URL.</b><br>Abrí <code>index.html</code>, pegá la URL " +
                      "de tu web app en <code>URL_APP</code> y volvé a subir el archivo.";
    return;
  }
  frame.src = URL_APP + (URL_APP.indexOf("?") >= 0 ? "&" : "?") + "app=celular";
})();
</script>
</body>
</html>
